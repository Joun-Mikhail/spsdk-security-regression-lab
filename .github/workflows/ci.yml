name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Ruff + pytest (Python 3.12, SPSDK 3.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment and tool versions
        run: |
          python --version
          python -m pip show spsdk cryptography pytest ruff | grep -E "^(Name|Version):"
          nxpcrypto --version

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run regression tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - name: Run demonstration script
        run: python scripts/demo.py

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: warn
